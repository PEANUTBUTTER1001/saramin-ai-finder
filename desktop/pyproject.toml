[project]
name = "saramin-finder-desktop"
version = "0.1.0"
description = "Local Saramin posting archive and watch app"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.11.2",
  "requests==2.34.2",
  "beautifulsoup4==4.14.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
